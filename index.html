<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
    />
    <title>Project Work Log</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const isGitHubPages = window.location.hostname.endsWith('github.io');

      if (isGitHubPages) {
        window.__USE_PAGES_BUNDLE__ = true;

        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = '/taskManager/assets/app.css';
        document.head.appendChild(stylesheet);

        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/taskManager/assets/app.js';
        document.body.appendChild(script);
      } else {
        window.__USE_PAGES_BUNDLE__ = false;
      }
    </script>
    <script type="module">
      if (!window.__USE_PAGES_BUNDLE__) {
        import('/src/main.tsx');
      }
    </script>
  </body>
</html>
